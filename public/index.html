<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>On-call Copilot</title>
    <style>
      :root {
        --bg: #12100e;
        --panel: #1b1815;
        --line: #322c26;
        --ink: #efe9e1;
        --dim: #9a8f83;
        --hot: #d2703a;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--ink);
        font: 15px/1.55 ui-monospace, "SF Mono", Menlo, monospace;
        display: flex;
        justify-content: center;
        padding: 16px;
      }
      main { width: 100%; max-width: 760px; display: flex; flex-direction: column; gap: 14px; }
      header { border-bottom: 1px solid var(--line); padding-bottom: 12px; }
      h1 { margin: 0; font-size: 17px; letter-spacing: 0.02em; }
      header p { margin: 4px 0 0; color: var(--dim); font-size: 13px; }
      .log {
        flex: 1;
        min-height: 320px;
        border: 1px solid var(--line);
        background: var(--panel);
        padding: 14px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .turn { white-space: pre-wrap; word-break: break-word; }
      .who { color: var(--hot); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; }
      .turn.user .who { color: var(--dim); }
      form { display: flex; gap: 8px; }
      input, button, textarea {
        font: inherit;
        background: var(--panel);
        color: var(--ink);
        border: 1px solid var(--line);
        padding: 10px 12px;
      }
      input, textarea { flex: 1; }
      button { cursor: pointer; border-color: var(--hot); color: var(--hot); }
      button[disabled] { opacity: 0.5; cursor: progress; }
      details { border: 1px solid var(--line); padding: 10px 12px; }
      summary { cursor: pointer; color: var(--dim); }
      pre { white-space: pre-wrap; word-break: break-word; margin: 10px 0 0; }
      .err { color: #e06a5a; }
      .placeholder {
        margin: auto;
        text-align: center;
        color: var(--dim);
        font-size: 13px;
        max-width: 46ch;
      }
      .placeholder.err { color: #e06a5a; }
      .dots::after {
        content: "";
        animation: dots 1.2s steps(4, end) infinite;
      }
      @keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }
      @media (prefers-reduced-motion: reduce) {
        .dots::after { content: "..."; animation: none; }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>On-call Copilot</h1>
        <p>Llama 3.3 on Workers AI. History lives in a Durable Object; deep triage runs as a Workflow.</p>
      </header>

      <div class="log" id="log">
        <p class="placeholder dots" id="placeholder">Loading your thread</p>
      </div>
      <form id="chat">
        <input id="text" placeholder="Describe what you're seeing…" autocomplete="off" required />
        <button id="send" type="submit">Send</button>
      </form>

      <details>
        <summary>Run a durable investigation (Workflow)</summary>
        <form id="inv">
          <textarea id="report" rows="3" placeholder="Paste the incident report…" required></textarea>
          <button type="submit">Start</button>
        </form>
        <pre id="invout"></pre>
      </details>
    </main>

    <script>
      const session = (() => {
        let s = localStorage.getItem("session");
        if (!s) {
          s = crypto.randomUUID().replace(/-/g, "");
          localStorage.setItem("session", s);
        }
        return s;
      })();

      const log = document.getElementById("log");
      const send = document.getElementById("send");

      function setPlaceholder(text, isError) {
        const existing = document.getElementById("placeholder");
        if (!text) {
          existing?.remove();
          return;
        }
        const el = existing ?? document.createElement("p");
        el.id = "placeholder";
        el.className = "placeholder" + (isError ? " err" : "");
        el.textContent = text;
        if (!existing) log.appendChild(el);
      }

      function turn(who, text = "") {
        const el = document.createElement("div");
        el.className = "turn " + who;
        el.innerHTML = '<div class="who"></div><div class="body"></div>';
        el.querySelector(".who").textContent = who === "user" ? "you" : "copilot";
        el.querySelector(".body").textContent = text;
        setPlaceholder("");
        log.appendChild(el);
        log.scrollTop = log.scrollHeight;
        return el.querySelector(".body");
      }

      fetch(`/api/history?session=${session}`)
        .then((r) => {
          if (!r.ok) throw new Error(`history returned ${r.status}`);
          return r.json();
        })
        .then(({ messages }) => {
          if (!messages.length) {
            setPlaceholder("Nothing here yet. Describe the symptom and what changed recently.");
            return;
          }
          messages.forEach((m) => turn(m.role, m.content));
        })
        .catch((err) => setPlaceholder("Could not load your thread: " + err.message, true));

      document.getElementById("chat").addEventListener("submit", async (e) => {
        e.preventDefault();
        const input = document.getElementById("text");
        const text = input.value.trim();
        if (!text) return;
        input.value = "";
        turn("user", text);
        const body = turn("assistant", "…");
        send.disabled = true;

        try {
          const res = await fetch(`/api/chat?session=${session}`, {
            method: "POST",
            body: JSON.stringify({ text }),
          });
          if (!res.ok) throw new Error(await res.text());
          const reader = res.body.getReader();
          const dec = new TextDecoder();
          let buf = "";
          let answer = "";
          for (;;) {
            const { done, value } = await reader.read();
            if (done) break;
            buf += dec.decode(value, { stream: true });
            const frames = buf.split("\n\n");
            buf = frames.pop() ?? "";
            for (const f of frames) {
              const ev = /event: (\w+)/.exec(f)?.[1];
              const data = /data: (.*)/.exec(f)?.[1];
              if (ev === "token" && data) {
                answer += JSON.parse(data);
                body.textContent = answer;
                log.scrollTop = log.scrollHeight;
              } else if (ev === "error" && data) {
                body.classList.add("err");
                body.textContent = "error: " + JSON.parse(data).message;
              }
            }
          }
          if (!answer) body.textContent = "(no response)";
        } catch (err) {
          body.classList.add("err");
          body.textContent = "error: " + err.message;
        } finally {
          send.disabled = false;
        }
      });

      document.getElementById("inv").addEventListener("submit", async (e) => {
        e.preventDefault();
        const out = document.getElementById("invout");
        out.textContent = "starting…";
        const report = document.getElementById("report").value.trim();
        try {
          const { incidentId } = await fetch("/api/investigate", {
            method: "POST",
            body: JSON.stringify({ report }),
          }).then((r) => r.json());
          out.textContent = `incident ${incidentId}\npolling…`;
          for (let i = 0; i < 60; i++) {
            await new Promise((r) => setTimeout(r, 2000));
            const row = await fetch(`/api/incident/${incidentId}`).then((r) => r.json());
            if (row.status === "complete") {
              out.textContent = `${row.summary}\n\n${row.checklist}`;
              return;
            }
          }
          out.textContent = "still running; check back later";
        } catch (err) {
          out.textContent = "error: " + err.message;
        }
      });
    </script>
  </body>
</html>
